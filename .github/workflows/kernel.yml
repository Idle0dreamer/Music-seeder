name: kernel

on:
  push:
  pull_request:

jobs:
  debug-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pinned sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install GCC 14
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14
      - name: Check patch hygiene
        run: git diff --check
      - name: Debug law suite
        run: make CXX=g++-14 kernel-test
      - name: Optimized executable
        run: make CXX=g++-14 kernel
      - name: CLI generation
        run: |
          ./build/kernel 1
          ./build/kernel 2
          ./build/kernel sikah 53
      - name: Upload kernel binaries
        uses: actions/upload-artifact@v4
        with:
          name: music-seeder-kernel-binaries
          if-no-files-found: error
          path: |
            build/kernel
            build/kernel-tests

  undefined:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pinned sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install GCC 14
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14
      - name: Undefined-behavior suite
        run: make CXX=g++-14 kernel-sanitize
      - name: Upload sanitizer binary
        uses: actions/upload-artifact@v4
        with:
          name: music-seeder-sanitizer-binary
          if-no-files-found: error
          path: build/kernel-tests-sanitize

  faust-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project files
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check out only the Faust inputs
        run: |
          git submodule update --init --filter=blob:none --jobs=1 \
            third_party/audio/faust third_party/audio/faustlibraries
      - name: Install Faust build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libmicrohttpd-dev
      - name: Build pinned Faust compiler
        run: |
          make -C third_party/audio/faust/build cmake \
            BACKENDS=regular.cmake TARGETS=regular.cmake
          make -C third_party/audio/faust/build -j2
      - name: Generate C++ from the physical-modeling probe
        run: |
          third_party/audio/faust/build/bin/faust \
            -I third_party/audio/faustlibraries \
            -a third_party/audio/faust/architecture/minimal-effect.cpp \
            -lang cpp \
            -cn music_seed_modal_probe \
            synthesis/models/modal_probe.dsp \
            -o /tmp/music_seed_modal_probe.cpp
          test -s /tmp/music_seed_modal_probe.cpp
          grep -q music_seed_modal_probe /tmp/music_seed_modal_probe.cpp
          g++ -std=c++17 \
            -I third_party/audio/faust/architecture \
            -c /tmp/music_seed_modal_probe.cpp \
            -o /tmp/music_seed_modal_probe.o
      - name: Generate C++ from the coupled-course Faust source
        run: |
          third_party/audio/faust/build/bin/faust \
            -I third_party/audio/faustlibraries \
            -a third_party/audio/faust/architecture/minimal-effect.cpp \
            -lang cpp \
            -cn music_seed_santur_courses \
            synthesis/models/santur_courses.dsp \
            -o /tmp/music_seed_santur_courses.cpp
          test -s /tmp/music_seed_santur_courses.cpp
          grep -q music_seed_santur_courses /tmp/music_seed_santur_courses.cpp
          grep -q release_seconds /tmp/music_seed_santur_courses.cpp
          g++ -std=c++17 \
            -I third_party/audio/faust/architecture \
            -c /tmp/music_seed_santur_courses.cpp \
            -o /tmp/music_seed_santur_courses.o
      - name: Upload Faust compiler binary
        uses: actions/upload-artifact@v4
        with:
          name: music-seeder-faust-compiler
          if-no-files-found: error
          path: third_party/audio/faust/build/bin/faust

  synthesis-render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check out required Faust sources
        run: |
          git submodule update --init --filter=blob:none --jobs=1 \
            third_party/audio/faust third_party/audio/faustlibraries
      - name: Install GCC 14
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 cmake libmicrohttpd-dev qt6-base-dev
      - name: Build the synthesis adapter
        run: make CXX=g++-14 synthesis
      - name: Build the Faust-generated synthesis adapter
        run: make CXX=g++-14 synthesis-faust
      - name: Build the desktop player
        run: make CXX=g++-14 synthesis-ui
      - name: Render deterministic Sikah WAV through both adapters
        run: |
          ./build/synthesis-render --maqam sikah --seed 53 \
            --duration 30 \
            --output /tmp/music-seeder-sikah.wav \
            > /tmp/music-seeder-sikah-report.txt
          test -s /tmp/music-seeder-sikah.wav
          grep -a -q RIFF /tmp/music-seeder-sikah.wav
          grep -Eq 'distinct_phrase_candidates: [2-9]' \
            /tmp/music-seeder-sikah-report.txt
          ./build/synthesis-faust-render --maqam sikah --seed 53 \
            --duration 30 \
            --output /tmp/music-seeder-sikah-faust.wav
          test -s /tmp/music-seeder-sikah-faust.wav
          grep -a -q RIFF /tmp/music-seeder-sikah-faust.wav
          ./build/synthesis-faust-render --maqam sikah --seed 53 \
            --duration 30 \
            --output /tmp/music-seeder-sikah-faust-repeat.wav
          cmp -s /tmp/music-seeder-sikah-faust.wav /tmp/music-seeder-sikah-faust-repeat.wav
      - name: Render a continuous Bayati performance through both adapters
        run: |
          ./build/synthesis-render --maqam bayati --seed 17 \
            --duration 30 \
            --output /tmp/music-seeder-bayati.wav \
            > /tmp/music-seeder-bayati-report.txt
          test -s /tmp/music-seeder-bayati.wav
          grep -a -q RIFF /tmp/music-seeder-bayati.wav
          grep -Eq 'phrase_stages: (main,development,branch,return,){2,}' \
            /tmp/music-seeder-bayati-report.txt
          grep -Eq 'phrase_spans: (phrase.establish,phrase.develop,phrase.return,phrase.establish,){2,}' \
            /tmp/music-seeder-bayati-report.txt
          awk '$1 == "seconds:" && ($2 + 0) < 30 { exit 1 }' \
            /tmp/music-seeder-bayati-report.txt
          grep -Eq 'distinct_phrase_candidates: [2-9]' \
            /tmp/music-seeder-bayati-report.txt
          ./build/synthesis-faust-render --maqam bayati --seed 17 \
            --duration 30 \
            --output /tmp/music-seeder-bayati-faust.wav \
            > /tmp/music-seeder-bayati-faust-report.txt
          test -s /tmp/music-seeder-bayati-faust.wav
          grep -a -q RIFF /tmp/music-seeder-bayati-faust.wav
          grep -Eq 'phrase_stages: (main,development,branch,return,){2,}' \
            /tmp/music-seeder-bayati-faust-report.txt
          grep -Eq 'phrase_spans: (phrase.establish,phrase.develop,phrase.return,phrase.establish,){2,}' \
            /tmp/music-seeder-bayati-faust-report.txt
          awk '$1 == "seconds:" && ($2 + 0) < 30 { exit 1 }' \
            /tmp/music-seeder-bayati-faust-report.txt
      - name: Render every collection-defined performance through both adapters
        run: |
          packages=(ajam bayati hijaz kurd nahawand nikriz rast sikah)
          seed=101
          for maqam in "${packages[@]}"; do
            if [[ "$maqam" == "sikah" ]]; then
              expected_stages='main,development,return,'
            else
              expected_stages='main,development,branch,return,'
            fi
            ./build/synthesis-render --maqam "$maqam" --seed "$seed" \
              --duration 10 \
              --output "/tmp/music-seeder-${maqam}.wav" \
              > "/tmp/music-seeder-${maqam}-report.txt"
            test -s "/tmp/music-seeder-${maqam}.wav"
            grep -a -q RIFF "/tmp/music-seeder-${maqam}.wav"
            grep -Eq "phrase_stages: (${expected_stages}){2,}" \
              "/tmp/music-seeder-${maqam}-report.txt"
            grep -Eq 'phrase_spans: (phrase.establish,phrase.develop,phrase.return,phrase.establish,){2,}' \
              "/tmp/music-seeder-${maqam}-report.txt"
            awk '$1 == "seconds:" && ($2 + 0) < 10 { exit 1 }' \
              "/tmp/music-seeder-${maqam}-report.txt"
            ./build/synthesis-faust-render --maqam "$maqam" --seed "$seed" \
              --duration 10 \
              --output "/tmp/music-seeder-${maqam}-faust.wav" \
              > "/tmp/music-seeder-${maqam}-faust-report.txt"
            test -s "/tmp/music-seeder-${maqam}-faust.wav"
            grep -a -q RIFF "/tmp/music-seeder-${maqam}-faust.wav"
            grep -Eq "phrase_stages: (${expected_stages}){2,}" \
              "/tmp/music-seeder-${maqam}-faust-report.txt"
            grep -Eq 'phrase_spans: (phrase.establish,phrase.develop,phrase.return,phrase.establish,){2,}' \
              "/tmp/music-seeder-${maqam}-faust-report.txt"
            awk '$1 == "seconds:" && ($2 + 0) < 10 { exit 1 }' \
              "/tmp/music-seeder-${maqam}-faust-report.txt"
            seed=$((seed + 1))
          done
      - name: Upload deterministic Sikah artifacts
        uses: actions/upload-artifact@v4
        with:
          name: music-seeder-sikah-wav
          if-no-files-found: error
          path: |
            /tmp/music-seeder-sikah*.wav
            /tmp/music-seeder-bayati*.wav
            /tmp/music-seeder-ajam*.wav
            /tmp/music-seeder-hijaz*.wav
            /tmp/music-seeder-kurd*.wav
            /tmp/music-seeder-nahawand*.wav
            /tmp/music-seeder-nikriz*.wav
            /tmp/music-seeder-rast*.wav
            /tmp/music-seeder-*-report.txt
      - name: Upload synthesis binaries
        uses: actions/upload-artifact@v4
        with:
          name: music-seeder-player-binaries
          if-no-files-found: error
          path: |
            build/synthesis-render
            build/synthesis-faust-render
            build/synthesis-ui
